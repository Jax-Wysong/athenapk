    resolutions: [4, 8, 16, 32, 64]
    visualization_resolution: 64
    output_dt: 0.01
    fps: 8

    directions:
      right: [1, 0, 0]
      left: [-1, 0, 0]
      up: [0, 1, 0]
      down: [0, -1, 0]
      up-right: [1, 1, 0]
      up-left: [-1, 1, 0]
      down-right: [1, -1, 0]
      down-left: [-1, -1, 0]

