  # Driven-turbulence comparison between native GLM-MHD and the second- and
  # fourth-order UCT-HLLD schemes. This remains independent of the global
  # reconstruction settings above.
  turbulence:
    enabled: true
    input: /mnt/home/wysongj2/athenapk-fourth-Berta24/inputs/turbulence_weno_compare.in
    dirname: turbulence
    output_group: mhd_comparison
    energy_plotting_script: /mnt/home/wysongj2/athenapk-fourth-Berta24/workflow/diagnostics_scripts/turbulence_energies.py
    slice_plotting_script: /mnt/home/wysongj2/athenapk-fourth-Berta24/workflow/diagnostics_scripts/turbulence_slices.py
    resolution: [128, 128, 128]
    meshblock: [32, 32, 32]
    tlim: 15.0
    history_dt: 0.005
    output_dt: 5.0
    cases:
      weno3:
        label: GLM-HLLD WENO3 + VL2
        fluid: glmmhd
        riemann: hlld
        reconstruction: weno3
        integrator: vl2
        convergence_order: 2
        first_order_flux_correct: true
      weno5:
        label: GLM-HLLD WENO5 + VL2
        fluid: glmmhd
        riemann: hlld
        reconstruction: wenoz
        integrator: vl2
        convergence_order: 2
        first_order_flux_correct: true
      uct2_weno3:
        label: UCT-HLLD WENO3 + RK2
        fluid: ucthlldmhd
        riemann: hlld
        reconstruction: weno3
        integrator: rk2
        convergence_order: 2
        first_order_flux_correct: false
      uct4_berta:
        label: UCT-HLLD Berta4 + RK4
        fluid: ucthlldmhd
        riemann: hlld
        reconstruction: wenoz_point
        integrator: rk4
        convergence_order: 4
        first_order_flux_correct: false
    mpi_tasks: 64
    mem_mb_per_cpu: 1200
